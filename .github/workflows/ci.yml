name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Linux runs the full battery: fmt, clippy, build, test, doc. The
  # external cross-validation tests (e2fsck, mke2fs, sgdisk, qemu-img,
  # …) only fire here because they need apt-supplied tools.
  test-linux:
    name: test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gdisk \
            fdisk \
            e2fsprogs \
            genext2fs \
            dosfstools \
            mtools \
            qemu-utils \
            exfatprogs \
            xfsprogs \
            hfsprogs \
            ntfs-3g \
            f2fs-tools \
            squashfs-tools \
            libfuse3-dev \
            pkg-config
          # Sanity-check that everything we cross-validate against is on PATH.
          which sgdisk
          which fdisk
          which e2fsck
          which debugfs
          which mke2fs
          which genext2fs
          which fsck.vfat
          which mdir
          which mtype
          which qemu-img
          # Newer FS validators — best-effort: log the binary name(s) we
          # find, but don't fail the job if a package is missing on the
          # runner. The per-FS tests skip when their tool is absent.
          for tool in fsck.exfat mkfs.exfat xfs_repair xfs_db mkfs.xfs \
                      fsck.hfsplus newfs_hfsplus ntfsfix ntfsls ntfscat \
                      mkntfs fsck.f2fs mkfs.f2fs dump.f2fs \
                      unsquashfs mksquashfs; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "found: $tool ($(command -v "$tool"))"
            else
              echo "missing: $tool (test will skip)"
            fi
          done

      # littlefs has no packaged fsck; the reference C implementation is
      # reached through its Python binding instead (tests/littlefs_external.rs
      # skips itself when the module is missing).
      - name: Install littlefs reference implementation
        run: |
          python3 -m pip install --user --break-system-packages littlefs-python \
            || python3 -m pip install --user littlefs-python \
            || echo "littlefs-python unavailable (littlefs cross-checks will skip)"
          python3 -c "import littlefs; print('littlefs-python ok')" || true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo build
        run: cargo build --all-targets --verbose

      - name: cargo test
        run: cargo test --all-targets --verbose

      - name: cargo doc
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

      # A library consumer must not pay for the binary. `clap` and
      # `rustyline` are the CLI's alone; if either shows up in the
      # library-only resolve, something lost its `cli` / `readline` gate.
      # The test run is part of the guarantee: it catches a CLI-driven
      # test that forgot its `#[cfg(feature = "cli")]` and would other-
      # wise fail on the binary this configuration does not build.
      - name: library-only build carries no CLI dependencies
        run: |
          set -euo pipefail
          if cargo tree -e normal --no-default-features \
               --features codecs,containers --prefix none \
               | grep -Ew 'clap|rustyline'; then
            echo "::error::a CLI dependency leaked into the library-only build"
            exit 1
          fi
          cargo test --no-default-features --features codecs,containers

      # The leanest hosted configuration: every filesystem, no CLI, no
      # serialization, no logging, no Unix ioctls, and no codecs beyond
      # the zlib that `grf` cannot write without. It must build, lint and
      # pass its tests, and its resolve must be free of the crates below.
      # This is the floor the feature gating promises a `std` consumer.
      - name: leanest std build
        run: |
          set -euo pipefail
          cargo clippy --no-default-features --features std,filesystems --all-targets -- -D warnings
          cargo test --no-default-features --features std,filesystems
          for crate in serde serde_json tomlproc clap rustyline log purecrypto; do
            if cargo tree -e normal --no-default-features --features std,filesystems \
                 --prefix none | grep -qw "$crate"; then
              echo "::error::$crate leaked into the leanest std build"; exit 1
            fi
          done

      # One filesystem at a time. Each backend's feature must stand on its
      # own (plus whatever it declares), with no unused-import or dead-code
      # noise from the dispatch layers — the gating in inspect / repack /
      # spec / memconv / the CLI is what this exercises. A handful of
      # representative combinations rather than the full power set.
      - name: single-filesystem builds
        run: |
          set -euo pipefail
          for feats in std,fat std,ext std,exfat std,littlefs std,tar std,archive \
                       std,hfs std,hfs-plus std,apfs std,xfs std,ntfs std,f2fs \
                       std,iso9660 std,squashfs std,grf std,affs std,ramfs \
                       std,fat,fat-noalloc \
                       std,fat,qcow2 std,ext,luks std,ext,tar,ramfs \
                       cli,readline,fat cli,readline,ext,spec cli,readline,filesystems,containers,codecs; do
            echo "::group::--features $feats"
            cargo clippy --no-default-features --features "$feats" --all-targets -- -D warnings
            echo "::endgroup::"
          done

      # The embedded core: `#![no_std]` + `alloc`, the block / partition /
      # filesystem traits with FAT, exFAT and littlefs, compiled for a
      # Cortex-M4F. The `cdylib` crate type (for wasm-bindgen) can't exist
      # without std, so the check names `rlib` explicitly. The same set is
      # unit-tested on the host in its no_std configuration, and a `uuid`
      # resolve without `getrandom` proves nothing pulled in an OS.
      - name: no_std core (thumbv7em-none-eabihf)
        run: |
          set -euo pipefail
          rustup target add thumbv7em-none-eabihf
          for feats in fat exfat littlefs fat,exfat,littlefs; do
            echo "::group::no_std --features $feats"
            cargo rustc --lib --crate-type rlib --no-default-features --features "$feats" \
              --target thumbv7em-none-eabihf -- -D warnings
            echo "::endgroup::"
          done
          # Clippy through the cross target: the host build would trip over
          # the `cdylib` crate type (no allocator without std), the cross
          # build just drops it.
          cargo clippy --lib --no-default-features --features fat,exfat,littlefs \
            --target thumbv7em-none-eabihf -- -D warnings
          cargo test --lib --no-default-features --features fat,exfat,littlefs
          # And the floor below that: FAT with no allocator at all.
          cargo rustc --lib --crate-type rlib --no-default-features --features fat-noalloc \
            --target thumbv7em-none-eabihf -- -D warnings
          cargo clippy --lib --no-default-features --features fat-noalloc \
            --target thumbv7em-none-eabihf -- -D warnings
          cargo test --lib --no-default-features --features fat-noalloc
          if cargo tree -e normal --no-default-features --features fat,exfat,littlefs \
               --target thumbv7em-none-eabihf --prefix none | grep -Ew 'getrandom|libc|std'; then
            echo "::error::an OS dependency leaked into the no_std core"; exit 1
          fi

      # And a real firmware image: the standalone example crate links the
      # FAT core for a Cortex-M4F with its own allocator, panic handler and
      # linker script. Its size is printed so a regression is visible in
      # the log (see examples/embedded-cortex-m/README.md for the baseline).
      - name: no_std example links (Cortex-M4F)
        run: |
          set -euo pipefail
          rustup component add llvm-tools
          # The job-level RUSTFLAGS replaces (not merges with) the rustflags in
          # the example's .cargo/config.toml, which would drop the linker
          # script and leave an empty image; spell the link arguments here.
          (cd examples/embedded-cortex-m && \
             RUSTFLAGS="-D warnings -C link-arg=-Tlink.x -C link-arg=--nmagic" cargo build --release)
          bin=examples/embedded-cortex-m/target/thumbv7em-none-eabihf/release/fstool-embedded-cortex-m
          "$(rustc --print sysroot)"/lib/rustlib/*/bin/llvm-size "$bin"
          # An empty .text means the linker garbage-collected the program
          # (a dropped entry point), which would make the check meaningless.
          text=$("$(rustc --print sysroot)"/lib/rustlib/*/bin/llvm-size "$bin" | awk 'NR==2 {print $1}')
          if [ "$text" -lt 20000 ]; then
            echo "::error::the no_std example linked to only $text bytes of .text"; exit 1
          fi
          # The same program against the allocator-free driver, with no
          # `#[global_allocator]` anywhere: rustc refuses to link a binary
          # that needs the `alloc` crate without one, so this step failing
          # means something behind `fat-noalloc` started allocating.
          (cd examples/embedded-cortex-m && \
             RUSTFLAGS="-D warnings -C link-arg=-Tlink.x -C link-arg=--nmagic" \
             cargo build --release --no-default-features --features heapless)
          heapless=examples/embedded-cortex-m/target/thumbv7em-none-eabihf/release/fstool-embedded-heapless
          "$(rustc --print sysroot)"/lib/rustlib/*/bin/llvm-size "$heapless"
          text=$("$(rustc --print sysroot)"/lib/rustlib/*/bin/llvm-size "$heapless" | awk 'NR==2 {print $1}')
          if [ "$text" -lt 8000 ]; then
            echo "::error::the heapless example linked to only $text bytes of .text"; exit 1
          fi

  # macOS proves the lib + CLI compile and unit-test cleanly on a
  # non-Linux Unix. `qemu-img` is available via Homebrew so the qcow2
  # round-trip suite runs here too; sgdisk / e2fsck / mke2fs / mtools
  # aren't packaged in stock Homebrew, so those tests skip themselves.
  test-macos:
    name: test (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install validators (qemu + squashfs-tools)
        run: |
          # ntfs-3g was removed from homebrew-core (deprecated upstream
          # since 2022). Skip it on macOS; ntfs writer tests fall back
          # to the skip path. APFS validation uses Apple's `hdiutil` +
          # `fsck_apfs` which ship built-in; same for `fsck_hfs` /
          # `newfs_hfs`. No exfat / xfs / f2fs Linux validators on
          # macOS; those tests skip themselves.
          brew install qemu squashfs
          for tool in hdiutil fsck_apfs fsck_hfs newfs_hfs \
                      unsquashfs mksquashfs qemu-img; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "found: $tool ($(command -v "$tool"))"
            else
              echo "missing: $tool (test will skip)"
            fi
          done

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo build
        run: cargo build --all-targets --verbose

      - name: cargo test
        run: cargo test --all-targets --verbose

  # Every other job runs `stable`, so nothing there would notice if a new
  # dependency release — or a bit of syntax we reach for — quietly pushed the
  # floor above the `rust-version` we publish in Cargo.toml. This job pins the
  # declared MSRV and compiles against it, so that drift fails the PR instead
  # of reaching crates.io. `--all-features` matches the clippy step (it pulls
  # in `fuse`, hence libfuse3-dev). Keep the toolchain here in lockstep with
  # `rust-version` in Cargo.toml.
  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev pkg-config

      - uses: dtolnay/rust-toolchain@1.88

      - uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --all-targets --all-features --verbose

  # Windows proves the Unix-only paths in populate_from_host_dir /
  # build_plan / file.rs are properly cfg-gated. Almost all external
  # cross-validation tests skip here (their tools aren't on the runner),
  # which is the contract: the in-process tests must still pass.
  test-windows:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo build
        run: cargo build --all-targets --verbose

      - name: cargo test
        run: cargo test --all-targets --verbose
