name: Deploy web UI to GitHub Pages

# Builds the fstool WebAssembly bundle (from the `fstool` crate's `wasm`
# feature) and the Vue/Vite site, then publishes it. Everything the site does
# runs client-side in the visitor's browser.

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "web/**"
      - "Cargo.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel superseded runs.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Codec features minus readline/fuse (neither builds for wasm); plus `wasm`.
  WASM_FEATURES: "wasm,gzip,xz,lzma,lz4,zstd,lzo,cab,amiga-lzx,lha,arc,sit,sevenz,rar,dmg-bzip2,dmg-lzfse,dmg-encrypted"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (with wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo + build
        uses: Swatinem/rust-cache@v2

      # Pinned to the wasm-bindgen version in Cargo.toml.
      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.121

      - name: Build wasm (fstool cdylib)
        run: |
          cargo build --release --lib \
            --target wasm32-unknown-unknown \
            --no-default-features --features "$WASM_FEATURES"

      - name: Generate JS bindings (bundler target)
        run: |
          wasm-bindgen \
            --target bundler \
            --out-dir web/src/wasm \
            --no-typescript \
            target/wasm32-unknown-unknown/release/fstool.wasm

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build site
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
